<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>交易速覽</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="tray.css"></head>
<body class="tray-body"><header><img src="assets/app.png" alt=""><div><strong>Shioaji <small>交易速覽</small></strong><span id="workspace">載入中</span></div><button id="customize" class="quiet" aria-expanded="false" title="自訂顯示區塊">⚙ 顯示</button><button id="open" class="secondary" title="開啟交易工作台">↗</button></header>
<div id="preferences" hidden><strong>顯示區塊</strong><label><input type="checkbox" data-section="strategy" checked>股票策略</label><label><input type="checkbox" data-section="positions" checked>持倉損益</label><label><input type="checkbox" data-section="watch" checked>監測清單</label><label><input type="checkbox" data-section="orders" checked>未完成委託</label><label><input type="checkbox" id="privacy">隱藏金額</label></div>
<main><section data-panel="positions"><h2>持倉與未實現毛利</h2><div id="positions"></div></section>
<section class="tray-status"><div><strong id="activity">等待資料</strong><small id="updated"></small></div><p id="connection"></p><p id="codex"></p><p id="issue" class="analysis-issue" hidden></p></section>
<section class="tray-capital"><div><span>可用現金</span><strong id="cash">—</strong></div><div><span>總資產 TWD</span><strong id="equity">—</strong></div><small id="settlement"></small><small id="account-at"></small></section>
<section class="tray-schedule"><span>下一輪 <strong id="next"></strong></span><span>最近偵測 <strong id="monitor"></strong></span><span>未完成委託 <strong id="order-count"></strong></span></section>
<section data-panel="strategy"><h2>已決定的股票策略 <button id="strategy-open" class="quiet">策略表 ↗</button></h2><small id="expiry"></small><div id="strategies"></div></section>
<section data-panel="watch"><h2>監測股票</h2><div id="watch"></div></section>
<section data-panel="orders"><h2>未完成委託</h2><div id="pending"></div></section></main>
<footer><button id="settings" class="secondary">帳戶與設定</button><button id="diagnostics" class="quiet">連線診斷</button><button id="hide" class="quiet">收起 Esc</button></footer><script type="module" src="tray-renderer.js"></script></body></html>
