name: TypeScript checks and Windows app
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prepare:broker
      - run: npm test
        if: runner.os != 'Windows'
      - run: npm run test:windows
        if: runner.os == 'Windows'
      - name: Windows Authenticode report verification
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/sign-windows.ps1).Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw 'Windows signing script syntax failed' }
          $sample = Join-Path $env:RUNNER_TEMP 'SYNTHETIC signature fixture 空白.exe'
          Add-Type -TypeDefinition 'public class SignatureFixture { public static void Main() {} }' -OutputAssembly $sample -OutputType ConsoleApplication
          $json = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/sign-windows.ps1 -FilePath $sample -Mode none
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification did not complete' }
          $result = $json | ConvertFrom-Json
          if ($result.status -ne 'NotSigned' -or $result.publisher -or $result.code_signing -or $result.timestamped) { throw 'An unsigned executable was incorrectly marked as a verified publisher' }
          $env:WINDOWS_SIGNATURE_FIXTURE = $sample
          $nodeJson = & node --input-type=module -e "import {readWindowsSignature} from './scripts/windows-signature.mjs'; console.log(JSON.stringify(readWindowsSignature(process.env.WINDOWS_SIGNATURE_FIXTURE,'none')));"
          if ($LASTEXITCODE -ne 0) { throw 'Node/PowerShell signing bridge failed for a filename with spaces and Unicode' }
          $nodeResult = $nodeJson | ConvertFrom-Json
          if ($nodeResult.status -ne 'NotSigned' -or $nodeResult.sha256 -ne $result.sha256 -or $nodeResult.name -ne (Split-Path $sample -Leaf)) { throw 'Node/PowerShell signing report did not preserve the filename and digest' }
          $probe = @'
          node --input-type=module -e "import {readWindowsSignature} from './scripts/windows-signature.mjs'; console.log(JSON.stringify(readWindowsSignature(process.env.WINDOWS_SIGNATURE_FIXTURE,'none')));"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          '@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($probe))
          $pwshJson = & pwsh.exe -NoProfile -NonInteractive -EncodedCommand $encoded
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 -> Node -> Windows PowerShell inherited incompatible signing modules' }
          $pwshResult = $pwshJson | ConvertFrom-Json
          if ($pwshResult.status -ne 'NotSigned' -or $pwshResult.sha256 -ne $result.sha256 -or $pwshResult.name -ne (Split-Path $sample -Leaf)) { throw 'PowerShell 7 signing bridge changed the filename or digest' }
          Remove-Item Env:WINDOWS_SIGNATURE_FIXTURE
          Remove-Item $sample -Force
      - run: npm run demo
      - run: npm run backtest:demo
      - name: Electron Windows workbench smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node -e "require('electron')"
          $env:TRADER_SMOKE_OUTPUT = Join-Path (Get-Location) 'release'
          $resultPath = Join-Path $env:TRADER_SMOKE_OUTPUT 'SMOKE-RESULT.json'
          Remove-Item $resultPath -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath (Resolve-Path node_modules/electron/dist/electron.exe).Path -ArgumentList @('.', '--smoke-test') -PassThru -NoNewWindow
          $finished = $process.WaitForExit(300000)
          if (Test-Path $resultPath) { Get-Content $resultPath -Raw | Write-Host }
          if (-not $finished) { $process.Kill(); throw 'Electron smoke test timed out; see stage report' }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($result.status -ne 'PASSED' -or $result.packaged -or $result.version -ne $version) { throw 'Source GUI checks did not complete' }
      - name: Save verified Windows captures in Git
        if: runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CAPTURE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          CAPTURE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/save-windows-captures.mjs
  strategy_validation:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Five-way strategy, sensitivity and execution stress comparisons
        env:
          VALIDATION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/validate-strategies.mjs
      - name: Preserve anonymized comparison reports in a separate Git branch
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VALIDATION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          VALIDATION_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/save-strategy-validation.mjs
  windows:
    needs: [test, strategy_validation]
    permissions:
      contents: write
    concurrency:
      group: release-build-${{ github.ref }}
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: electron-builder-windows-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-builder-windows-
      - run: npm run prepare:broker -- --platform=win32 --arch=x64
      - run: npm run build
      - run: node scripts/package-windows.mjs
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ github.ref == 'refs/heads/main' && secrets.WINDOWS_SIGNING_PFX_BASE64 || '' }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.WINDOWS_SIGNING_PFX_PASSWORD || '' }}
          WINDOWS_SIGNING_CERTIFICATE_SHA1: ${{ github.ref == 'refs/heads/main' && vars.WINDOWS_SIGNING_CERTIFICATE_SHA1 || '' }}
          WINDOWS_SIGNING_REQUIRED: ${{ github.ref == 'refs/heads/main' && vars.WINDOWS_SIGNING_REQUIRED || '' }}
      - run: node scripts/release-assets.ts
      - name: Packaged app smoke test
        shell: pwsh
        run: |
          $env:TRADER_SMOKE_OUTPUT = (Resolve-Path release).Path
          $resultPath = Join-Path $env:TRADER_SMOKE_OUTPUT 'SMOKE-RESULT.json'
          Remove-Item $resultPath -Force -ErrorAction SilentlyContinue
          $exe = Get-ChildItem release/Shioaji-Codex-Trader-*-Windows-x64.exe | Select-Object -First 1
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -PassThru
          $finished = $process.WaitForExit(360000)
          if (Test-Path $resultPath) { Get-Content $resultPath -Raw | Write-Host }
          if (-not $finished) { $process.Kill(); throw 'Packaged app smoke test timed out; see stage report' }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($result.status -ne 'PASSED' -or -not $result.packaged -or $result.version -ne $version) { throw 'Packaged GUI checks did not complete' }
      - name: Publish verified Windows pre-release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node scripts/publish-release.mjs
